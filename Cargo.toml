[package]
name = "kali-ormachy"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
which = "6.0"

[lib]
name = "kali_ormachy"
path = "src/lib.rs"

[[bin]]
name = "kali-ormachy"
path = "src/main.rs"
